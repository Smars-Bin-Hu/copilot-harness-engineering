id: "1.2"
part: brain
core: true
title: {en: "When an Agent misuses a tool, check its description and errors first", zh-Hant: "Agent 用不好工具，先看工具的描述和錯誤訊息", zh-Hans: "Agent 用不好工具，先看工具的描述和报错"}
harness_tag: "1.5.50"
wondering: [05-tools, 13-commands]
sources:
  - what: "Client tools run in your application: the model returns stop_reason tool_use with tool_use blocks, your code runs it and sends back a tool_result; server tools run on the provider's side"
    where: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    checked: 2026-10-28
  - what: "Given a missing parameter, a model might infer a value you did not supply; not guaranteed either way"
    where: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    checked: 2026-10-28
  - what: "Description wording matters; errors should be actionable; limit and paginate responses (Claude Code caps tool responses at 25,000 tokens by default); fewer, focused tools; concise or detailed response format; name prefixes; evaluate with realistic tasks and read raw transcripts"
    where: https://www.anthropic.com/engineering/writing-tools-for-agents
    checked: 2026-10-28
  - what: "Why certain steps are done by a command and not left to the model; commands give a next field; JSON on a pipe, text in a terminal"
    where: harness wondering topic 5 (section 5.3) and docs/06-cost-optimization.md sections 1 and 4
  - what: "A refusal reason is shown to the agent and the user, so it must say why and what to do next"
    where: harness wondering topic 6 (section 6.2)
  - what: "Opus is more likely to ask for a missing parameter, Sonnet might infer one (get_weather location example); strict true guarantees calls match the schema"
    where: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    checked: 2026-10-31
  - what: "Small refinements to tool descriptions can yield dramatic improvements; Sonnet 3.5 reached state-of-the-art on SWE-bench Verified after description refinements; user_id instead of user; search_contacts over list_contacts; schedule_event; prefix or suffix naming varies by model; response_format example of 206 and 72 tokens; transcripts pasted into Claude Code"
    where: https://www.anthropic.com/engineering/writing-tools-for-agents
    checked: 2026-10-31
  - what: "A chat request can have a maximum of 128 tools enabled; deselect tools in the picker"
    where: https://code.visualstudio.com/docs/copilot/agents/agent-tools
    checked: 2026-10-31
  - what: "Tool search loads tools on demand; it searches tool names, descriptions, argument names and argument descriptions; defer_loading controls what enters the context window, not what you send in the request"
    where: https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool
    checked: 2026-10-31
  - what: "Claude Code: tool search on by default; MCP tools deferred; tool search matches against the tool's description"
    where: https://code.claude.com/docs/en/mcp
    checked: 2026-10-31
  - what: "VS Code: tool search on by default for Claude Sonnet 4.5+ and Opus 4.5+; a core of about 30 tools is always included, the rest load on request"
    where: https://code.visualstudio.com/updates/v1_118
    checked: 2026-10-31
