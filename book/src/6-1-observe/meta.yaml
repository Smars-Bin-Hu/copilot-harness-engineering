wondering: [12-observe-report]
sources:
  - what: "The eight records and the question each answers; one log line per call; no tool arguments and no prompt content, except path and command for a refused call; usage read from the platform's own session record, with a fallback to times only; the self-check and its three grades; the hook's own errors"
    where: harness docs/02-features.md (Observability) and docs/00-overview.md section 5, and the observe lesson of the wondering course
  - what: "You will not know if your graders work unless you read the transcripts and grades from many trials; reading transcripts is how you verify that your eval measures what matters"
    where: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
    checked: 2026-10-27
