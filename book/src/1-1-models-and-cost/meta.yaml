id: "1.1"
part: brain
core: true
title: {en: "Don't pick a model by token price alone", zh-Hant: "選模型，別只看 token 單價", zh-Hans: "选模型，别只看 token 单价"}
harness_tag: "1.5.50"
wondering: [01-agent-loop]
sources:
  - what: "One agent against three roles: about 4.5 times the usage for the same results (4 tasks, one run each)"
    where: harness docs/06-cost-optimization.md, section 9 (see chapter 2.3)
  - what: "What the harness does and does not record about usage; ways to read less, write less and redo less"
    where: harness docs/06-cost-optimization.md, sections 1-8
  - what: "When the result is wrong, check what the model knew before switching to a bigger model"
    where: harness wondering topic 1, section 1.5
  - what: "Cache reads cost one tenth of the base input price on most models (less on some); 5-minute cache writes cost 1.25 times the base input price and 1-hour writes cost 2 times"
    where: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    checked: 2026-10-28
  - what: "Tool names, descriptions and schemas count as input tokens on every request"
    where: https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview
    checked: 2026-10-28
  - what: "From June 1, 2026 premium request units are replaced by GitHub AI Credits; usage is calculated from input, output and cached tokens; annual Pro and Pro+ plans stay on premium requests until they expire"
    where: https://github.blog/news-insights/company-news/github-copilot-is-moving-to-usage-based-billing/
    checked: 2026-10-28
  - what: "On the legacy plan, prompts you send count as premium requests, tool calls do not; each model has a multiplier"
    where: https://docs.github.com/en/copilot/concepts/billing/copilot-requests
    checked: 2026-10-28
  - what: "List prices per million tokens: Sonnet 5.5 $2 input, $2.50 5-minute cache write, $0.10 cache hit, $10 output; Opus 5.5 $4 input, $20 output; cache hits on Opus 5.5 and Sonnet 5.5 are 0.05 times the base input price, most other models 0.1 times"
    where: https://platform.claude.com/docs/en/about-claude/pricing
    checked: 2026-10-31
  - what: "Cache order tools, system, messages; a change at one level invalidates that level and the ones after it; exact match; default lifetime 5 minutes, refreshed for free on use; minimum cacheable length 512 tokens for Sonnet 5.5, up to 4,096 on some older models, with no error when shorter"
    where: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    checked: 2026-10-31
  - what: "1 AI credit is $0.01; input, output and cached tokens are priced per model"
    where: https://docs.github.com/en/copilot/concepts/billing/usage-based-billing-for-individuals
    checked: 2026-10-31
  - what: "Copilot Pro is $10 a month including $10 in AI Credits; code completions and Next Edit suggestions stay included; legacy premium requests are 300 a month on Pro and 1,500 on Pro+, for annual plans that stayed after June 1, 2026"
    where: https://github.blog/news-insights/company-news/github-copilot-is-moving-to-usage-based-billing/ and https://docs.github.com/en/copilot/concepts/billing/copilot-requests
    checked: 2026-10-31
  - what: "Thinking effort is set in the VS Code model picker through the arrow next to the model name; models without reasoning do not show it"
    where: https://code.visualstudio.com/docs/copilot/customization/language-models
    checked: 2026-10-31
