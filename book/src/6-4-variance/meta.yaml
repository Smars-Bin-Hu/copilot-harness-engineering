  - what: "Model outputs vary between runs, so run multiple trials; pass@k is the chance of at least one correct solution in k attempts; pass^k falls as k grows because it demands consistency across more trials"
    where: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
    checked: 2026-10-27
