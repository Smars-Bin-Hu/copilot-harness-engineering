en:
  agent-head: "the agent does more of"
  person-head: "the person keeps"
  a1: "reading and searching code"
  a2: "writing the changes"
  a3: "running the steps"
  a4: "fixing what its own checks find"
  p1: "what to do"
  p2: "what is allowed (the rules)"
  p3: "where to say yes"
  p4: "whether the result is good"
  caption: "The more the agent does, the more the person's work moves up to four judgments."
zh-Hant:
  agent-head: "agent 做得更多的事"
  person-head: "人留下的事"
  a1: "讀、搜尋程式碼"
  a2: "寫修改"
  a3: "跑各個步驟"
  a4: "修自己的檢查找到的問題"
  p1: "要做什麼"
  p2: "什麼被允許（規則）"
  p3: "在哪裡說「好」"
  p4: "結果好不好"
  caption: "agent 做得越多，人的工作就越往上移，剩下這四個判斷。"
zh-Hans:
  agent-head: "agent 做得更多的事"
  person-head: "人留下的事"
  a1: "读、搜索代码"
  a2: "写改动"
  a3: "跑各个步骤"
  a4: "修自己的检查找到的问题"
  p1: "要做什么"
  p2: "什么被允许（规则）"
  p3: "在哪里点头"
  p4: "结果好不好"
  caption: "agent 做得越多，人的工作就越往上移，剩下这四个判断。"
