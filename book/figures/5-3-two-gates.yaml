en:
  plan: "plan"
  plan-n: "written, then stop"
  g1: "gate 1"
  g1-n: "you, in a terminal"
  g1-n2: "approve the plan"
  work: "work"
  work-n: "inside the folder"
  work-n2: "snapshots at the gates"
  g2: "gate 2"
  g2-n: "you, in a terminal"
  g2-n2: "approve the diff"
  repo: "repo"
  repo-n: "a new branch"
  void: "plan changed: the approval no longer holds"
  step-1: "The agent writes the plan and stops. It cannot go on."
  step-2: "Gate 1. The person reads the plan in an editor, then types the approval in a terminal. The agent has no way to type it."
  step-3: "The agent works inside the task folder. A copy of the work is kept at each gate, so a broken state can be found again."
  step-4: "Gate 2. The person reads the exact diff, then approves in the terminal. Only then does the result reach the repository."
  step-5: "The approval is tied to the exact plan that was read. Change the plan and the approval is void."
  caption: "Two gates, at the points that cost money, grant power or cannot be undone. Each is an action the agent cannot do for the person."
zh-Hant:
  plan: "計畫"
  plan-n: "寫完就停"
  g1: "第一道門"
  g1-n: "你，在終端機"
  g1-n2: "批准計畫"
  work: "工作"
  work-n: "在資料夾裡"
  work-n2: "過門時留快照"
  g2: "第二道門"
  g2-n: "你，在終端機"
  g2-n2: "批准差異"
  repo: "倉庫"
  repo-n: "寫進新分支"
  void: "計畫改了：批准就不再有效"
  step-1: "agent 寫好計畫就停下，不能繼續。"
  step-2: "第一道門。人在編輯器裡讀計畫，再到終端機輸入批准。agent 沒辦法替人輸入。"
  step-3: "agent 在任務資料夾裡工作。每道門都留一份工作的副本，壞了可以找回那一刻的樣子。"
  step-4: "第二道門。人讀確切的差異，再在終端機批准。之後結果才進到倉庫。"
  step-5: "批准綁在人讀過的那份計畫上。計畫一改，批准就作廢。"
  caption: "兩道門，放在花錢、放權、不可逆的點上。每道都是 agent 替不了人做的動作。"
zh-Hans:
  plan: "计划"
  plan-n: "写完就停"
  g1: "关卡 1"
  g1-n: "你，在终端里"
  g1-n2: "批准计划"
  work: "工作"
  work-n: "在文件夹里"
  work-n2: "过关时留快照"
  g2: "关卡 2"
  g2-n: "你，在终端里"
  g2-n2: "批准 diff"
  repo: "仓库"
  repo-n: "写进新分支"
  void: "计划改了：批准就不再有效"
  step-1: "agent 写好计划就停下，不能继续。"
  step-2: "关卡 1。人在编辑器里读计划，再到终端里敲批准。agent 没办法替人敲。"
  step-3: "agent 在任务文件夹里工作。每道关卡都留一份工作的副本，坏了可以找回那一刻的样子。"
  step-4: "关卡 2。人读确切的 diff，再在终端里批准。之后结果才进到仓库。"
  step-5: "批准绑在人读过的那份计划上。计划一改，批准就作废。"
  caption: "两道关卡，放在花钱、授权、无法撤销的点上。每道都是 agent 替不了人做的动作。"
