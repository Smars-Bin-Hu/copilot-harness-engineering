en:
  h-q: "THE QUESTION"
  h-t: "WHAT ANSWERS IT"
  q1: "What happened on each call?"
  t1: "the session log"
  q2: "How many calls, refusals?"
  t2: "stats over the logs"
  q3: "Which knowledge files get read?"
  t3: "a reading record"
  q4: "What did a task do? Who approved?"
  t4: "the task report"
  q5: "Where did time and usage go?"
  t5: "an analysis page"
  q6: "Which task waits for me?"
  t6: "the board"
  q7: "Is the setup itself healthy?"
  t7: "a health check"
  q8: "Did behaviour change after edits?"
  t8: "fixed scenarios"
  caption: "Eight questions, eight records. The first one, the log of every call, is what the others are built on."
zh-Hant:
  h-q: "問題"
  h-t: "誰來回答"
  q1: "每次呼叫發生了什麼？"
  t1: "工作階段紀錄"
  q2: "多少提示、呼叫、拒絕？"
  t2: "對紀錄做統計"
  q3: "哪些知識庫檔案被讀過？"
  t3: "讀取紀錄"
  q4: "這個任務做了什麼？誰批准？"
  t4: "任務報告"
  q5: "時間和用量花在哪？"
  t5: "分析頁"
  q6: "哪個任務在等我？"
  t6: "看板"
  q7: "設定本身健康嗎？"
  t7: "健康檢查"
  q8: "我改完之後，行為變了嗎？"
  t8: "固定情境"
  caption: "八個問題，八種紀錄。第一種，記下每次呼叫的紀錄，是其他幾種的基礎。"
zh-Hans:
  h-q: "问题"
  h-t: "谁来回答"
  q1: "每次调用发生了什么？"
  t1: "会话日志"
  q2: "多少调用、拒绝？"
  t2: "对日志做统计"
  q3: "哪些知识库文件被读过？"
  t3: "读取记录"
  q4: "这个任务做了什么？谁审批？"
  t4: "任务报告"
  q5: "时间和用量花在哪？"
  t5: "分析页"
  q6: "哪个任务在等我？"
  t6: "看板"
  q7: "配置本身健康吗？"
  t7: "健康检查"
  q8: "我改完之后，行为变了吗？"
  t8: "固定场景"
  caption: "八个问题，八种记录。第一种，记下每次调用的日志，是其他几种的基础。"
