en:
  a: "no private data"
  a-how: "keys and secrets stay out of reach"
  b: "no untrusted text"
  b-how: "read only what you trust or reviewed"
  c: "no way out"
  c-how: "nowhere to send, or a short list"
  pick: "You need only one of the three."
  pick2: "Choose the one that costs you least."
  caption: "Three ways to break the combination. One is enough."
zh-Hant:
  a: "沒有私密資料"
  a-how: "金鑰與機密碰不到"
  b: "沒有不可信的文字"
  b-how: "只讀信得過或已審過的"
  c: "沒有出路"
  c-how: "沒地方可送，或只有一張短名單"
  pick: "三樣只要拿掉一樣就夠了。"
  pick2: "挑代價最小的那一樣。"
  caption: "打破這個組合的三種方法。一種就夠。"
