en:
  goal: "one goal"
  goal-n: "idea, list of steps, progress pointer"
  t1: "task 1"
  t1n: "accepted"
  t2: "task 2"
  t2n: "in progress"
  t3: "task 3"
  t4: "task 4"
  note: "Each task is small enough to check and accept on its own."
  caption: "A big job is one goal with a few tasks under it. One task at a time is done, checked and accepted."
zh-Hant:
  goal: "一個目標"
  goal-n: "核心想法、步驟清單、進度指標"
  t1: "任務 1"
  t1n: "已驗收"
  t2: "任務 2"
  t2n: "進行中"
  t3: "任務 3"
  t4: "任務 4"
  note: "每個任務都小到可以單獨檢查、單獨驗收。"
  caption: "大事是一個目標，底下幾個任務。一次做完、檢查、驗收一個任務。"
