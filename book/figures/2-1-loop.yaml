en:
  request: "you + the rules"
  model: the model
  model-note: "only writes text"
  ask: "tool call"
  program: the program
  program-note: "runs the tool"
  result: "result, as text"
  repeat: "...until the model says it is done"
  p1: "what it reads"
  p2: "which tools exist"
  p3: "hook: before a call"
  p4: "hook: after a call"
  points: "Four places where you can steer, in every turn"
  step-1: "You send a request. The platform adds the rules, and the model reads both."
  step-2: "The model does not touch your files. It writes a request for a tool call: read this file, run this command."
  step-3: "The program around the model runs the tool for real."
  step-4: "The result goes back to the model as text, and the model decides the next step. This repeats until it says it is done."
  step-5: "You cannot change the model's thinking. You can change what it reads, which tools exist, and what happens just before and just after each call."
  caption: "An agent is a loop. The model asks, the program acts, the result goes back. You steer at four places in each turn."
zh-Hant:
  request: "你的話 + 規則"
  model: 模型
  model-note: "只會寫文字"
  ask: "工具呼叫"
  program: 外面的程式
  program-note: "真正執行工具"
  result: "結果（文字）"
  repeat: "……直到模型說做完了"
  p1: "它讀到什麼"
  p2: "有哪些工具"
  p3: "hook：呼叫之前"
  p4: "hook：呼叫之後"
  points: "每一圈裡，你能插手的四個地方"
  step-1: "你送出需求。平台加上規則，模型把兩者一起讀進去。"
  step-2: "模型不會直接碰你的檔案。它寫出一個工具呼叫的請求：讀這個檔案、執行這個指令。"
  step-3: "模型外面的程式真正執行這個工具。"
  step-4: "結果以文字送回模型，模型決定下一步。這樣一圈圈重複，直到它說做完了。"
  step-5: "你改變不了模型怎麼想。你能改的是它讀到什麼、有哪些工具、以及每次呼叫的前後發生什麼。"
  caption: "agent 就是一個循環：模型提出要求，程式動手，結果送回去。每一圈裡你有四個地方可以插手。"
zh-Hans:
  request: "你的话 + 规则"
  model: 模型
  model-note: "只会写文本"
  ask: "工具调用"
  program: 外面的程序
  program-note: "真正运行工具"
  result: "结果（文本）"
  repeat: "……直到模型说做完了"
  p1: "它读什么"
  p2: "有哪些工具"
  p3: "hook：调用之前"
  p4: "hook：调用之后"
  points: "每一轮里，你能插手的四个地方"
  step-1: "你发出需求。平台加上规则，模型把两者一起读进去。"
  step-2: "模型不会直接碰你的文件。它写出一个工具调用的请求：读这个文件、运行这条命令。"
  step-3: "模型外面的程序真正运行这个工具。"
  step-4: "结果以文本送回模型，模型决定下一步。这样一轮轮重复，直到它说做完了。"
  step-5: "你改变不了模型怎么想。你能改的是它读什么、有哪些工具，以及每次调用的前后发生什么。"
  caption: "agent 就是一个循环：模型提出要求，程序动手，结果送回去。每一轮里你有四个地方可以插手。"
