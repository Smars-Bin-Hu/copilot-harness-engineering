en:
  c1: "commit 1"
  c2: "commit 2"
  c2-note: "changes one source"
  ca: "card A"
  cb: "card B"
  cc: "card C"
  ra: "read at commit 1"
  rb: "read at commit 1"
  rc: "read at commit 1"
  stale: "stale: B only"
  fixed: "read the diff, fix, stamp commit 2"
  step-1: "Three cards were written when the code was at commit 1. Each card records that commit."
  step-2: "The code moves on to commit 2. It changes the source that card B was written from."
  step-3: "Compare each card's commit with the code now. Only card B is stale. A and C are untouched."
  step-4: "Read only what changed in B's source, fix the lines of the card it touches, and stamp the card with commit 2."
  caption: "A card records the commit it was read at. When the code moves, the stale cards can be listed, and only they are looked at."
zh-Hant:
  c1: "提交 1"
  c2: "提交 2"
  c2-note: "改了一個來源"
  ca: "卡片 A"
  cb: "卡片 B"
  cc: "卡片 C"
  ra: "讀於提交 1"
  rb: "讀於提交 1"
  rc: "讀於提交 1"
  stale: "過期：只有 B"
  fixed: "讀 diff、改、蓋上提交 2"
  step-1: "三張卡片寫成時，程式碼在提交 1。每張卡片都記下這個提交。"
  step-2: "程式碼走到提交 2，改了卡片 B 所依據的那個來源。"
  step-3: "把每張卡片記的提交和現在的程式碼比。只有卡片 B 過期。A 和 C 沒動。"
  step-4: "只讀 B 的來源改了什麼，改卡片中被牽動的那幾行，再蓋上提交 2。"
  caption: "卡片記住讀的是哪個提交。程式碼一動，就能列出過期的卡片，只看它們。"
