en:
  title: "The same chat, three moments (the box is the context window)"
  early: "start"
  middle: "later"
  late: "much later"
  fresh: "new chat"
  legend: "bright: needed now. grey: old tool results and turns."
  step-1: "At the start the window holds the rules, the request and little else."
  step-2: "Every file read and command output stays. What the task needs now is the same size, but it sits in more and more old text."
  step-3: "Near the limit the window is full, and the platform has to summarise or drop things. The useful part is a small share."
  step-4: "A new chat starts with only what you carry over: the rules and a short note from a file."
  caption: "A long chat does not make the useful part bigger. It makes the rest bigger."
zh-Hant:
  title: "同一個對話，三個時間點（方框是上下文視窗）"
  early: "剛開始"
  middle: "之後"
  late: "很久之後"
  fresh: "新對話"
  legend: "亮：任務現在需要的。灰：舊的工具結果和舊的對話。"
  step-1: "剛開始，視窗裡只有規則、需求，沒什麼別的。"
  step-2: "讀過的每個檔案、跑過的每個指令輸出都留著。任務現在需要的東西一樣大，卻埋在越來越多的舊文字裡。"
  step-3: "接近上限時視窗滿了，平台只好摘要或丟掉一些。有用的部分只佔一小塊。"
  step-4: "新對話只帶你轉交過去的東西：規則，加上從檔案讀來的一小段筆記。"
  caption: "對話變長，不會讓有用的部分變大，只會讓其他部分變大。"
