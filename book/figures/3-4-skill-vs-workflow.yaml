en:
  skill-title: "A skill: one job, read as a whole"
  skill-body: "how this job is done here"
  skill-note: "and where it goes wrong"
  flow-title: "A workflow: several jobs in order"
  s1: "step 1"
  s2: "step 2"
  s3: "step 3"
  s4: "step 4"
  check: "has a check"
  person: "a person decides"
  caption: "A skill is one manual. A workflow is a chain of them, where each step says what must be true before it and what is checked after it, and which steps wait for a person."
zh-Hant:
  skill-title: "skill：一件事，整份讀"
  skill-body: "這件事在這裡怎麼做"
  skill-note: "還有哪裡會錯"
  flow-title: "workflow：幾件事，按順序"
  s1: "第 1 步"
  s2: "第 2 步"
  s3: "第 3 步"
  s4: "第 4 步"
  check: "有檢查"
  person: "由人決定"
  caption: "skill 是一份說明書。workflow 是一串說明書：每一步寫明做之前什麼要成立、做完檢查什麼，哪幾步要等人。"
