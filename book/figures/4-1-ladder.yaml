en:
  hook: "A hook refuses"
  hook-note: "stopped at run time; sees calls only"
  cmd: "A command checks"
  cmd-note: "same every time; guards only its own path"
  words: "Words"
  words-note: "the agent knows why; may not comply"
  after: "Found afterwards"
  after-note: "can find a breach, cannot prevent it"
  caption: "Three levels hold a rule at rising firmness. The last one only tells you whether they held."
zh-Hant:
  hook: "hook 拒絕"
  hook-note: "執行時就擋下；只看得到呼叫"
  cmd: "指令自己檢查"
  cmd-note: "每次結果一樣；只管走它的路"
  words: "文字"
  words-note: "agent 知道原因；可能不照做"
  after: "事後發現"
  after-note: "能發現違規，不能阻止"
  caption: "三級把規則守得越來越緊。最後一級只告訴你前面守住了沒有。"
zh-Hans:
  hook: "hook 拒绝"
  hook-note: "运行时就拦下；只看得到调用"
  cmd: "命令自己检查"
  cmd-note: "每次结果一样；只管走它的路"
  words: "文字"
  words-note: "agent 知道原因；可能不照做"
  after: "事后发现"
  after-note: "能发现违规，不能阻止"
  caption: "三级把规则守得越来越牢。最后一级只告诉你前面守住了没有。"
