en:
  read: "What it reads"
  read-note: "every call, minus cache hits"
  plus: "+"
  write: "What it writes"
  write-note: "answers, code, thinking"
  times: "×"
  redo: "Redoing"
  redo-note: "how many attempts"
  sum: "Cost of one finished task. Most savings are in the first and the last."
  caption: "A task's cost is what the model reads plus what it writes, multiplied by how often the work is redone."
zh-Hant:
  read: "讀的"
  read-note: "每次呼叫，扣掉快取命中"
  plus: "+"
  write: "寫的"
  write-note: "回答、程式碼、思考"
  times: "×"
  redo: "返工"
  redo-note: "做了幾次"
  sum: "一件事做成的成本。多數省錢發生在第一項和最後一項。"
  caption: "一個任務的成本是模型讀的加寫的，再乘上返工的次數。"
zh-Hans:
  read: "读的"
  read-note: "每次调用，扣掉缓存命中"
  plus: "+"
  write: "写的"
  write-note: "回答、代码、思考"
  times: "×"
  redo: "返工"
  redo-note: "做了几次"
  sum: "做完一个任务的成本。多数节省来自第一项和最后一项。"
  caption: "一个任务的成本，是模型读的加写的，再乘上返工的次数。"
