en:
  rules: "One page of rules"
  skill: "One skill"
  hook: "One hook"
  rules-note: "a request"
  skill-note: "a manual, read on demand"
  hook-note: "a rule, enforced"
  pain: "Then add only what a real pain asks for"
  p1: "ignores rules"
  p2: "bill too high"
  p3: "says done, fails"
  p4: "forgets"
  c1: "chapter 4.1"
  c2: "chapter 1.1"
  c3: "chapter 5.4"
  c4: "chapter 3.2"
  step-1: "Start small: a page of rules, one skill, one hook. Each holds the agent harder than the one before."
  step-2: "Then work. When something hurts, you will know which pain it is."
  step-3: "Each pain has a chapter. Add the part that answers it, and nothing else."
  caption: "A minimal harness grows by pain, not by plan."
zh-Hant:
  rules: "一頁規則"
  skill: "一個 skill"
  hook: "一個 hook"
  rules-note: "是請求"
  skill-note: "說明書，用到才讀"
  hook-note: "是規則，會強制"
  pain: "之後只加真實痛點要求的東西"
  p1: "不聽規則"
  p2: "帳單太高"
  p3: "說做完卻沒過"
  p4: "會忘"
  c1: "第 4.1 章"
  c2: "第 1.1 章"
  c3: "第 5.4 章"
  c4: "第 3.2 章"
  step-1: "從小的開始：一頁規則、一個 skill、一個 hook。後面的比前面的管得更緊。"
  step-2: "然後開始工作。哪裡痛，你自己會知道是哪一種痛。"
  step-3: "每種痛都有對應的章。只加能回答它的那一部分。"
  caption: "最小的 harness 按痛點長大，不按計畫長大。"
zh-Hans:
  rules: "一页规则"
  skill: "一个 skill"
  hook: "一个 hook"
  rules-note: "是请求"
  skill-note: "手册，用到才读"
  hook-note: "是规则，会强制执行"
  pain: "之后只加真实的痛点要求的东西"
  p1: "不听规则"
  p2: "账单太高"
  p3: "说做完了却没过"
  p4: "会忘事"
  c1: "第 4.1 章"
  c2: "第 1.1 章"
  c3: "第 5.4 章"
  c4: "第 3.2 章"
  step-1: "从小处开始：一页规则、一个 skill、一个 hook。后面的比前面的管得更紧。"
  step-2: "然后开始干活。哪里痛，你自己会知道是哪一种痛。"
  step-3: "每种痛都有对应的章。只加能解决它的那一部分。"
  caption: "最小的 harness 按痛点长大，不按计划长大。"
