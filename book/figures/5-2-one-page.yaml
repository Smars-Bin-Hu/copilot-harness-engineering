en:
  say: "vague words"
  say-n: "may leave"
  say-n2: "things out"
  ask: "agent asks"
  ask-n: "about what it"
  ask-n2: "cannot look up"
  page: "one-page"
  page2: "requirement"
  page-n: "written by"
  page-n2: "the agent"
  confirm: "person"
  confirm2: "confirms"
  confirm-n: "reads the page,"
  confirm-n2: "not the chat"
  change-n: "a change goes into the page first"
  step-1: "The person says what they want. It is short, it leaves things out, and it may change next hour."
  step-2: "The agent first looks up what it can find itself. It asks only about what it cannot: intent, scope, what counts as done."
  step-3: "The agent writes the answer as one page the person can read in minutes."
  step-4: "The person confirms the page. From now on the plan, the work and the checks all go by this page."
  step-5: "When the request changes, the page changes first, and the person confirms it again."
  caption: "The requirement is a page the agent writes and the person confirms. The person's first words are not it."
zh-Hant:
  say: "幾句含糊的話"
  say-n: "可能"
  say-n2: "漏東西"
  ask: "agent 追問"
  ask-n: "問它"
  ask-n2: "查不到的"
  page: "一頁"
  page2: "需求"
  page-n: "由 agent"
  page-n2: "來寫"
  confirm: "人"
  confirm2: "確認"
  confirm-n: "讀這一頁，"
  confirm-n2: "不是讀聊天"
  change-n: "有變動，先改這一頁"
  step-1: "人說出想要什麼。話很短，會漏東西，一小時後還可能變。"
  step-2: "agent 先查自己查得到的。只問查不到的：意圖、範圍、怎樣才算完成。"
  step-3: "agent 把答案寫成一頁，人幾分鐘就能讀完。"
  step-4: "人確認這一頁。之後計畫、工作、檢查都以這一頁為準。"
  step-5: "請求變了，先改這一頁，人再確認一次。"
  caption: "需求是 agent 寫、人確認的一頁。人最初說的話不是需求。"
