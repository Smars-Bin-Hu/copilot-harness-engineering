en:
  ask: "a request"
  ask-n: "in any session"
  folder: "task folder"
  folder-n1: "kind: what counts as done"
  folder-n2: "size: which files it has"
  work: "work"
  work-n: "inside; nothing else touched"
  back: "write back"
  back-n: "a gate: you approve"
  close: "close"
  close-n: "a report is written"
  more-n: "another session picks up from the files"
  step-1: "A request arrives in a session. Quick questions that write nothing need no task."
  step-2: "Work that changes things gets a task folder. Its kind sets what counts as done; its size sets which files it has."
  step-3: "The work is done inside the folder first. The folder holds the requirement, the plan and the progress."
  step-4: "Only a gate lets the result leave the folder and reach the real repository."
  step-5: "Closing the task writes a report a person can read."
  step-6: "Any session can pick the task up later by reading the folder. The task, not the chat, is the unit."
  caption: "A task is a folder with a life: opened, worked in, written back through a gate, closed."
zh-Hant:
  ask: "一個請求"
  ask-n: "在任何會話裡"
  folder: "任務資料夾"
  folder-n1: "種類：怎樣才算完成"
  folder-n2: "檔位：有哪些檔案"
  work: "在裡面做"
  work-n: "不碰別的地方"
  back: "寫回"
  back-n: "一道門：你批准"
  close: "結案"
  close-n: "自動寫報告"
  more-n: "別的會話讀檔案就能接手"
  step-1: "請求在某個會話裡出現。只問答、不寫東西的，不用開任務。"
  step-2: "要改東西的工作開一個任務資料夾。種類決定怎樣才算完成，檔位決定它有哪些檔案。"
  step-3: "工作先在資料夾裡做。資料夾裡有需求、計畫和進度。"
  step-4: "結果要離開資料夾、進到真正的倉庫，必須過一道門。"
  step-5: "結案時寫一份人讀得懂的報告。"
  step-6: "之後任何會話讀資料夾就能接手。工作單位是任務，不是聊天。"
  caption: "任務是一個有生命週期的資料夾：開啟、在裡面工作、過門寫回、結案。"
