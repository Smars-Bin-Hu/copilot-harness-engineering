en:
  window: "one context window"
  rules: "rules"
  tools: "tool list"
  files: "files it read"
  results: "tool results"
  chat: "chat"
  full: "full"
  illus: "Not to scale. The shares differ from task to task."
  step-1: "The window is a fixed size. Before you type anything, the rules and the list of tools already take a part of it."
  step-2: "Each file the agent reads goes into the window as whole text."
  step-3: "Every tool result goes in too: a search listing, a command's output, a test log."
  step-4: "Add the conversation itself, and the window is full. Every new item now pushes something older out or squeezes it into a summary."
  caption: "Everything the model reads in a turn shares one window. Each part you add leaves less room for the others."
zh-Hant:
  window: "一個上下文窗口"
  rules: "規則"
  tools: "工具清單"
  files: "讀過的檔案"
  results: "工具結果"
  chat: "對話"
  full: "滿了"
  illus: "示意，不按比例。每個任務的占比都不同。"
  step-1: "窗口的大小是固定的。你還沒打字，規則和工具清單就已經占了一部分。"
  step-2: "agent 讀的每個檔案，都以整段文字放進窗口。"
  step-3: "每個工具結果也要放進去：搜尋列表、指令輸出、測試日誌。"
  step-4: "再加上對話本身，窗口就滿了。之後每多放一樣，就要把更早的擠出去，或壓成摘要。"
  caption: "模型這一圈讀到的所有東西，共用同一個窗口。你多放一樣，別的就少一分空間。"
zh-Hans:
  window: "一个上下文窗口"
  rules: "规则"
  tools: "工具列表"
  files: "读过的文件"
  results: "工具结果"
  chat: "对话"
  full: "满了"
  illus: "示意，不按比例。每个任务的占比都不同。"
  step-1: "窗口的大小是固定的。你还没打字，规则和工具列表就已经占了一部分。"
  step-2: "agent 读的每个文件，都以整段文本放进窗口。"
  step-3: "每个工具结果也要放进去：搜索列表、命令输出、测试日志。"
  step-4: "再加上对话本身，窗口就满了。之后每多放一样，就要把更早的挤出去，或者压成摘要。"
  caption: "模型这一轮读到的所有东西，共用同一个窗口。你多放一样，别的就少一分空间。"
