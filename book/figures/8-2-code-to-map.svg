<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220">
  <rect class="box" x="10" y="50" width="100" height="60" rx="6"/>
  <text class="label" x="60" y="85" text-anchor="middle" data-t="code">x</text>
  <text class="label-muted" x="10" y="135" data-t="again" data-step="5">x</text>
  <text class="label-muted" x="10" y="153" data-t="again2" data-step="5">x</text>

  <g data-step="2">
    <path class="line" d="M110 80 H130"/>
    <path class="head" d="M130 74 L140 80 L130 86 Z"/>
    <rect class="box-lit" x="140" y="50" width="190" height="60" rx="6"/>
    <text class="label-lit" x="235" y="78" text-anchor="middle" data-t="extractor">x</text>
    <text class="label-lit" x="235" y="96" text-anchor="middle" data-t="extractor-note">x</text>
  </g>

  <g data-step="3">
    <path class="line-lit" d="M330 80 H340"/>
    <path class="head-lit" d="M340 74 L350 80 L340 86 Z"/>
    <rect class="box" x="350" y="50" width="240" height="60" rx="6"/>
    <text class="label" x="470" y="78" text-anchor="middle" data-t="map">x</text>
    <text class="label-muted" x="470" y="96" text-anchor="middle" data-t="map-note">x</text>
  </g>

  <g data-step="4">
    <rect class="box-plain" x="350" y="160" width="240" height="44" rx="6"/>
    <text class="label-muted" x="470" y="187" text-anchor="middle" data-t="known">x</text>
    <path class="line" d="M470 160 V120"/>
    <path class="head" d="M464 120 L470 110 L476 120 Z"/>
  </g>
</svg>
