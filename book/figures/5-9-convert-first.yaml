en:
  file: "Word or Excel"
  prog: "a program converts"
  text: "plain text"
  model: "model"
  good: "the model reads only the clean text;"
  good2: "same result every time, no tokens spent on converting"
  raw: "reads the raw file"
  bad: "pays for covers, hidden sheets and noise, and may guess"
  caption: "A fixed job such as converting a file goes to a program. The model gets only what needs judgment."
zh-Hant:
  file: "Word 或 Excel"
  prog: "程式轉換"
  text: "純文字"
  model: "模型"
  good: "模型只讀乾淨的文字；"
  good2: "每次結果相同，轉換不花 token"
  raw: "直接讀原始檔案"
  bad: "要為封面、隱藏工作表和雜訊付費，還可能猜錯"
  caption: "轉檔這種固定的活交給程式，模型只拿到需要判斷的部分。"
