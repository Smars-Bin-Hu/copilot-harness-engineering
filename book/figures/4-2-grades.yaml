en:
  g1: "Read"
  g1-ex: "git status, diff, log"
  g1-do: "pass"
  g2: "Reversible write"
  g2-ex: "git add, commit"
  g2-do: "refuse,"
  g2-do2: "a person approves"
  g3: "Cannot be undone"
  g3-ex: "git push,"
  g3-ex2: "reset --hard"
  g3-do: "refuse,"
  g3-do2: "a person runs it"
  axis: "what the action can break"
  caption: "Three grades of command, shown with git. The more a mistake costs, the less the agent decides alone."
zh-Hant:
  g1: "讀"
  g1-ex: "git status、diff、log"
  g1-do: "放行"
  g2: "寫，可撤回"
  g2-ex: "git add、commit"
  g2-do: "拒絕，"
  g2-do2: "由人批准"
  g3: "不可撤回"
  g3-ex: "git push、"
  g3-ex2: "reset --hard"
  g3-do: "拒絕，"
  g3-do2: "由人自己執行"
  axis: "這個動作能弄壞多少"
  caption: "命令的三個等級，以 git 為例。錯一次代價越大，agent 能自己決定的就越少。"
