en:
  folder: "the task folder"
  f1: "requirement"
  f2: "plan"
  f3: "to-do list"
  f4: "progress"
  s1: "session 1"
  s1n: "Monday"
  s2: "session 2"
  s2n: "Thursday"
  writes: "writes"
  reads: "reads"
  gone: "its chat is gone"
  step-1: "The memory of the work lives in one folder: the requirement, the plan, the to-do list and the progress."
  step-2: "The first session works, and writes what it did and what comes next into the folder."
  step-3: "The session ends, or its chat is shortened. What it held in its head is gone."
  step-4: "A new session, days later, starts by reading the folder and carries on."
  caption: "Sessions come and go. The folder stays, and it is the only memory the work has."
zh-Hant:
  folder: "任務資料夾"
  f1: "需求"
  f2: "計畫"
  f3: "待辦清單"
  f4: "進度"
  s1: "第 1 個會話"
  s1n: "週一"
  s2: "第 2 個會話"
  s2n: "週四"
  writes: "寫入"
  reads: "讀取"
  gone: "對話已消失"
  step-1: "這件事的記憶放在一個資料夾裡：需求、計畫、待辦清單和進度。"
  step-2: "第一個會話做事，把做了什麼、下一步是什麼寫進資料夾。"
  step-3: "會話結束，或對話被縮短。它腦子裡記的東西沒有了。"
  step-4: "幾天後的新會話，先讀資料夾，再接著做。"
  caption: "會話來了又走，資料夾留下來，它是這件事唯一的記憶。"
zh-Hans:
  folder: "任务文件夹"
  f1: "需求"
  f2: "计划"
  f3: "待办清单"
  f4: "进度"
  s1: "第 1 个会话"
  s1n: "周一"
  s2: "第 2 个会话"
  s2n: "周四"
  writes: "写入"
  reads: "读取"
  gone: "对话已消失"
  step-1: "这件事的记忆放在一个文件夹里：需求、计划、待办清单和进度。"
  step-2: "第一个会话干活，把做了什么、下一步是什么写进文件夹。"
  step-3: "会话结束，或者对话被缩短。它脑子里记的东西就没了。"
  step-4: "几天后的新会话，先读文件夹，再接着干。"
  caption: "会话来了又走，文件夹留下来，它是这件事唯一的记忆。"
