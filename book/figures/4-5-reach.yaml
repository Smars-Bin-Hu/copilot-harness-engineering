en:
  in-title: "what the agent is given"
  in1: "copies of files to edit"
  in2: "read-only facts and docs"
  in3: "answers pasted back"
  in-note: "A hook is a second line here,"
  in-note2: "not the first."
  wall: "never"
  wall2: "given"
  out-title: "what it never reaches"
  out1: "production, test systems"
  out2: "credentials and keys"
  out3: "others' repositories"
  out-note: "Nothing to block,"
  out-note2: "because nothing is there."
  caption: "The strongest limit is a thing that is not there. A hook can only refuse what it sees; what the agent cannot reach needs no hook."
zh-Hant:
  in-title: "交給 agent 的"
  in1: "要改的檔案的副本"
  in2: "唯讀的事實與文件"
  in3: "人貼回來的答案"
  in-note: "hook 在這裡是第二道線，"
  in-note2: "不是第一道。"
  wall: "根本"
  wall2: "不給"
  out-title: "它永遠碰不到的"
  out1: "生產與測試環境"
  out2: "憑證與金鑰"
  out3: "別人的儲存庫"
  out-note: "東西不在，"
  out-note2: "就沒有什麼要擋。"
  caption: "最強的限制，是那樣東西不在。hook 只能拒絕它看得見的；agent 碰不到的東西，不需要 hook。"
zh-Hans:
  in-title: "交给 agent 的"
  in1: "要改的文件的副本"
  in2: "只读的事实和文档"
  in3: "人贴回来的答案"
  in-note: "hook 在这里是第二道线，"
  in-note2: "不是第一道。"
  wall: "根本"
  wall2: "不给"
  out-title: "它永远够不着的"
  out1: "生产和测试环境"
  out2: "凭证和密钥"
  out3: "别人的仓库"
  out-note: "东西不在，"
  out-note2: "就没有什么要拦。"
  caption: "最强的限制，是那样东西不在。hook 只能拒绝它看得见的；agent 够不着的东西，不需要 hook。"
