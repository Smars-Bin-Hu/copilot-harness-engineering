  n-types: "types"
  n-visits: "visits"
  step-1: "第 1 批：資料表。它們不用別的東西，所以最先學。"
  step-2: "第 2 批：實體。每個實體對應一張資料表，那張表的卡片已經有了，所以它的卡片可以指向下面。"
  step-3: "第 3 批：儲存庫，它們讀實體。"
  step-4: "第 4 批：控制器，最後學。它用到的卡片都已寫好，所以不必再讀那些程式碼。"
  caption: "學習從依賴樹的底部往上走。亮起的每一排是一批。名稱來自開源範例 spring-petclinic。"
zh-Hans:
  rl1: "数据表"
  rl2: "实体"
  rl3: "仓库层"
  rl4: "控制器"
