  n-pettype: "PetType"
  n-visit: "Visit"
  n-owners: "owners"
  n-pets: "pets"
  n-types: "types"
  n-visits: "visits"
  step-1: "第 1 批：数据表。它们不依赖别的东西，所以最先学。"
  step-2: "第 2 批：实体。每个实体对应一张数据表，那张表的卡片已经有了，所以它的卡片可以指向下面。"
  step-3: "第 3 批：仓库层，它们读实体。"
  step-4: "第 4 批：控制器，最后学。它用到的卡片都已写好，所以不必再读那些代码。"
  caption: "学习从依赖树的底部往上走。亮起的每一排是一批。名称来自开源示例 spring-petclinic。"
