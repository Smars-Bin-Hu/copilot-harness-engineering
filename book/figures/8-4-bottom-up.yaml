en:
  rl1: "tables"
  rl2: "entities"
  rl3: "repositories"
  rl4: "controllers"
  n-ownercontroller: "OwnerController"
  n-ownerrepository: "OwnerRepository"
  n-pettyperepository: "PetTypeRepository"
  n-owner: "Owner"
  n-pet: "Pet"
  n-pettype: "PetType"
  n-visit: "Visit"
  n-owners: "owners"
  n-pets: "pets"
  n-types: "types"
  n-visits: "visits"
  step-1: "Batch 1: the tables. They use nothing else, so they come first."
  step-2: "Batch 2: the entities. Each one maps a table whose card now exists, so its card can point down to it."
  step-3: "Batch 3: the repositories, which read the entities."
  step-4: "Batch 4: the controller, last. It uses cards that are all written, so it does not re-read their code."
  caption: "Learning goes from the bottom of the dependency tree upward. Each lit row is one batch. Names are from the open-source spring-petclinic sample."
zh-Hant:
  rl1: "資料表"
  rl2: "實體"
  rl3: "儲存庫"
  rl4: "控制器"
  n-ownercontroller: "OwnerController"
