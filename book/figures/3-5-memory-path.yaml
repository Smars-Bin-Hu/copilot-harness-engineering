en:
  task: "task ends"
  draft: "draft"
  draft-note: "only a draft"
  review: "a person"
  review-note: "keep, edit or drop"
  memory: "memory entry"
  memory-note: "fact + source + date"
  overturn: "later: found wrong or old"
  overturn-note: "back to review, then fix or delete"
  step-1: "A task ends and has taught something."
  step-2: "The agent drafts what a future agent would get wrong. It only drafts."
  step-3: "A person reads the draft and decides what stays. This is the review point."
  step-4: "What stays is written with its source and the date it was true."
  step-5: "An entry can be overturned. When the source changes or a task shows it wrong, it goes back to review."
  caption: "A lesson reaches memory through a review point, and it can leave the same way."
zh-Hant:
  task: "任務結束"
  draft: "草稿"
  draft-note: "只是草稿"
  review: "人"
  review-note: "留、改或丟"
  memory: "記憶條目"
  memory-note: "事實 + 來源 + 日期"
  overturn: "之後：發現錯了或舊了"
  overturn-note: "回到審核，再改或刪"
  step-1: "一個任務結束，而且它教了點東西。"
  step-2: "agent 草擬「之後的 agent 會做錯的事」。它只擬草稿。"
  step-3: "人讀草稿，決定哪些留下。這就是審核點。"
  step-4: "留下的寫上來源，和它成立的日期。"
  step-5: "條目可以被推翻。來源變了或任務證明它錯了，就回到審核。"
  caption: "一條經驗經過審核點進入記憶，也經同一條路離開。"
zh-Hans:
  task: "任务结束"
  draft: "草稿"
  draft-note: "只是草稿"
  review: "人"
  review-note: "留、改或丢"
  memory: "记忆条目"
  memory-note: "事实 + 来源 + 日期"
  overturn: "之后：发现错了或旧了"
  overturn-note: "回到审核，再改或删"
  step-1: "一个任务结束，而且它教了点东西。"
  step-2: "agent 起草“将来的 agent 会做错的事”。它只起草。"
  step-3: "人读草稿，决定哪些留下。这就是审核点。"
  step-4: "留下的写上来源，和它成立的日期。"
  step-5: "条目可以被推翻。来源变了或任务证明它错了，就回到审核。"
  caption: "一条经验经过审核点进入记忆，也经同一条路离开。"
