en:
  tasks: "fixed tasks"
  tasks-note: "unchanged"
  run-before: "run before"
  run-after: "run after"
  run-note: "same way"
  score: "script scores"
  score-note: "pass or fail"
  compare: "compare"
  compare-note: "before vs after"
  read: "read failures"
  read-note: "see why"
  step-1: "Write down a small set of fixed tasks, each with a known right answer. They do not change between runs."
  step-2: "Run the same tasks before the change and after it, in the same way."
  step-3: "A script reads the results and scores each item, pass or fail. The same script, every time."
  step-4: "Compare the two score sheets. Did the change help, hurt, or do nothing?"
  step-5: "Then read the runs that failed. The score says that something failed; reading says why."
  caption: "An eval: fixed tasks, run before and after a change, scored by a script, then the failed runs read by a person."
zh-Hant:
  tasks: "固定任務"
  tasks-note: "每次都一樣"
  run-before: "改之前跑"
  run-after: "改之後跑"
  run-note: "同樣方式"
  score: "腳本打分"
  score-note: "過或不過"
  compare: "比較"
  compare-note: "改前 vs 改後"
  read: "讀失敗的運行"
  read-note: "用眼睛看原因"
  step-1: "寫下一小組固定任務，每個都有已知的正確答案。每次運行之間不變。"
  step-2: "改動之前和之後，用同樣的方式跑同一組任務。"
  step-3: "腳本讀結果，逐項打分，過或不過。每次都是同一個腳本。"
  step-4: "比較兩份成績單。改動是有幫助、有壞處，還是沒差？"
  step-5: "然後讀失敗的運行。分數告訴你有東西失敗了；讀過才知道為什麼。"
  caption: "Eval：固定任務，改動前後各跑一次，用腳本打分，再由人讀失敗的運行。"
zh-Hans:
  tasks: "固定任务"
  tasks-note: "每次都一样"
  run-before: "改之前跑"
  run-after: "改之后跑"
  run-note: "同样方式"
  score: "脚本打分"
  score-note: "过或不过"
  compare: "比较"
  compare-note: "改前 vs 改后"
  read: "读失败的运行"
  read-note: "看原因"
  step-1: "写下一小组固定任务，每个都有已知的正确答案。每次运行之间不变。"
  step-2: "改动之前和之后，用同样的方式跑同一组任务。"
  step-3: "脚本读结果，逐项打分，过或不过。每次都是同一个脚本。"
  step-4: "比较两份成绩单。改动是有帮助、有坏处，还是没差？"
  step-5: "然后读失败的运行。分数告诉你有东西失败了；读过才知道为什么。"
  caption: "评测：固定任务，改动前后各跑一次，用脚本打分，再由人读失败的运行。"
