en:
  always: "always loaded"
  always-note: "rules all need"
  by-file: "loaded by file"
  by-file-note: "rules per file type"
  on-demand: "read on demand"
  on-demand-note: "skills and notes"
  less: "costs every turn"
  more: "costs only when used"
  rule: "Put each rule in the cheapest place that still reaches it."
  rule-note: "Write it once. Elsewhere, keep a link and one sentence."
  caption: "Three places for written guidance. The further right, the less it costs when it is not needed, and the more it depends on the agent choosing to read it."
zh-Hant:
  always: "每次都載入"
  always-note: "每件事都需要的少數規則"
  by-file: "依檔案載入"
  by-file-note: "只管某一種檔案的規則"
  on-demand: "用到才讀"
  on-demand-note: "skill 和筆記"
  less: "每一輪都花錢"
  more: "用到才花錢"
  rule: "每條規則放在還找得到它的最便宜的地方。"
  rule-note: "只寫一次。別處放連結和一句話。"
  caption: "書面指引的三個位置。越往右，不需要時越省，但越依賴 agent 自己選擇去讀。"
