en:
  h1: "layer"
  h2: "owner"
  h3: "who reviews a change"
  l1: "Core"
  l1n: "rules for every task"
  l2: "Team"
  l2n: "skills and knowledge"
  l3: "Personal"
  l3n: "my name, paths"
  o1: "1 or 2 people"
  r1: "always a 2nd person"
  o2: "one per area"
  r2: "owner + one more"
  o3: "the individual"
  r3: "none; not committed"
  caption: "Three layers of rules. The wider the harm of a mistake, the fewer the owners and the stricter the review."
zh-Hant:
  h1: "層"
  h2: "擁有者"
  h3: "誰審修改"
  l1: "核心"
  l1n: "每個任務的規則、圍欄"
  l2: "團隊"
  l2n: "領域 skill、知識、共用設定"
  l3: "個人"
  l3n: "名字、語言、本機路徑"
  o1: "一兩位指定的人"
  r1: "一定要有第二個人"
  o2: "每個領域一位"
  r2: "領域擁有者再加一位"
  o3: "個人自己"
  r3: "不審；不提交"
  caption: "規則分三層。錯了影響越廣，擁有者越少，審查越嚴。"
