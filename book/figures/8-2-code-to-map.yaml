en:
  code: "the code"
  again: "next time:"
  again2: "only changed files"
  extractor: "extractors"
  extractor-note: "a script per kind"
  map: "the map"
  map-note: "every object, every use"
  known: "uses a person knew"
  step-1: "The code is the truth. Objects and uses are written in it, in the forms your stack uses."
  step-2: "Extractors are small scripts. Each reads one kind of file and prints the objects and uses it finds. The same input gives the same output."
  step-3: "The output is the map: every object that exists, and who uses whom."
  step-4: "A few uses that a person knew are written down as a test. Every run must find all of them."
  step-5: "On the next run, only the files that changed are read again."
  caption: "The map is computed from the code by scripts, the same way every time, at no token cost."
zh-Hant:
  code: "程式碼"
  again: "下次："
  again2: "只重讀改過的檔案"
  extractor: "抽取器"
  extractor-note: "每種檔案一支腳本"
  map: "地圖"
  map-note: "每個物件、每一個「用」"
  known: "人本來就知道的「用」"
  step-1: "程式碼才是真相。物件和「用」就寫在裡面，形式取決於你的技術棧。"
  step-2: "抽取器是小腳本。每支讀一種檔案，印出它找到的物件和「用」。同樣的輸入，同樣的輸出。"
  step-3: "輸出就是地圖：有哪些物件，誰用誰。"
  step-4: "幾個人本來就知道的「用」寫下來當測試。每次執行都必須全部找到。"
  step-5: "下一次，只重讀改過的檔案。"
  caption: "地圖由腳本從程式碼算出來，每次一樣，不花 token。"
