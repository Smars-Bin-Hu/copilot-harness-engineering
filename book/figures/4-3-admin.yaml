en:
  time: "time"
  "on": "person types a code"
  open: "fence open, this session only"
  "off": "switched off"
  record: "calls marked admin; person reads the diff"
  step-1: "A person types a code in their own terminal. The agent cannot do this."
  step-2: "For this session only, the guardrail files can be changed. The approval records stay locked."
  step-3: "When the work is done, the person switches it off."
  step-4: "The log marked every call in between, and the person reads the diff of what changed."
  caption: "A person opens the fence for one session, then closes it. The override is bound to the session, not to an agent."
zh-Hant:
  time: "時間"
  "on": "人輸入驗證碼"
  open: "圍欄打開，只限這個會話"
  "off": "關掉"
  record: "呼叫都標為 admin；人讀 diff"
  step-1: "人在自己的終端機輸入驗證碼。agent 做不到這件事。"
  step-2: "只在這個會話內，圍欄的檔案可以改。批准紀錄仍然鎖著。"
  step-3: "工作做完，人把它關掉。"
  step-4: "這中間的每次呼叫日誌都做了標記，人再讀一次改了什麼的 diff。"
  caption: "人為一個會話打開圍欄，再關上。放開的權限綁在會話上，不綁在 agent 上。"
