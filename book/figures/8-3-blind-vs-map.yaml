en:
  miss: "only the reader"
  miss-note: "map missed it"
  both: "both have it"
  both-note: "agreement"
  fake: "only the map"
  fake-note: "in the code?"
  recall: "recall: share of found uses on the map"
  recall-note: "the reader's list = left + middle"
  precision: "precision: share of map uses that are real"
  caption: "Two lists of uses for the same objects. Every difference is looked up again at its line, because the reader can be wrong too."
zh-Hant:
  miss: "只有盲讀的人有"
  miss-note: "地圖漏了"
  both: "兩邊都有"
  both-note: "吻合"
  fake: "只有地圖有"
  fake-note: "程式碼裡有嗎？"
  recall: "召回：讀的人找到的「用」，地圖有多少"
  recall-note: "讀的人的清單 = 左 + 中"
  precision: "精度：地圖裡的「用」，有多少是真的"
  caption: "同一批物件的兩份「用」清單。每個差異都回到原行再看一次，因為讀的人也可能錯。"
zh-Hans:
  miss: "只有盲读者有"
  miss-note: "地图漏了"
  both: "两边都有"
  both-note: "吻合"
  fake: "只有地图有"
  fake-note: "代码里有吗？"
  recall: "召回率：读者找到的使用，地图有多少"
  recall-note: "读者的清单 = 左 + 中"
  precision: "精确率：地图里的使用，有多少是真的"
  caption: "同一批对象的两份使用清单。每处差异都回到对应的行再看一次，因为读者也可能错。"
