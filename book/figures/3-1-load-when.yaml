en:
  a-title: "Load everything first"
  a-all: "all rules, all notes, all files"
  a-left: "room"
  b-title: "Load an index, fetch what the task needs"
  b-index: "index"
  b-page: "the page"
  b-room: "room for the work"
  note: "Same task, same window. Illustration, not measured."
  caption: "Loading everything first spends the window before the work starts. An index plus a fetch on demand keeps the room for the task."
zh-Hant:
  a-title: "先全部放進去"
  a-all: "所有規則、所有筆記、所有檔案"
  a-left: "剩下"
  b-title: "放目錄，要用再取"
  b-index: "目錄"
  b-page: "那一頁"
  b-room: "留給工作的空間"
  note: "同一個任務、同一個窗口。示意圖，不是實測。"
  caption: "先全部放進去，工作還沒開始窗口就用掉了。目錄加按需取用，才把空間留給任務。"
