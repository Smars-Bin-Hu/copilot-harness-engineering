en:
  main: "the main agent"
  main-note: "starts workers, keeps the task files"
  todo-1: "step 1"
  todo-2: "step 2"
  todo-3: "step 3"
  tick: "✓"
  worker: "worker"
  worker-note: "work + tests"
  report: "report"
  reviewer: "reviewer"
  reviewer-note: "checks the whole result"
  step-1: "You hand over the whole to-do list. The main agent takes your place as the one in charge."
  step-2: "For step 1 it writes a brief and starts a fresh worker. The worker does the step and its tests."
  step-3: "The worker reports back in a few lines. The main agent ticks the step off in the task files."
  step-4: "Every step gets a new worker with an empty context. The main agent holds only the plan, the checklist and the reports."
  step-5: "When all steps are done, the reviewer checks the whole result."
  caption: "A manager and many workers: the main agent keeps the plan and the checklist; each step goes to a fresh worker with a written brief."
zh-Hant:
  main: "主 agent"
  main-note: "開 worker，維護任務檔案"
  todo-1: "第 1 步"
  todo-2: "第 2 步"
  todo-3: "第 3 步"
  tick: "✓"
  worker: "worker"
  worker-note: "實作 + 測試"
  report: "簡短匯報"
  reviewer: "reviewer"
  reviewer-note: "檢查整體結果"
  step-1: "你把整份待辦清單交出去，主 agent 代替你負責。"
  step-2: "第 1 步：它寫好說明，開一個新的 worker。worker 負責這一步和它的測試。"
  step-3: "worker 用幾行字匯報結果，主 agent 在任務檔案裡把這一步打勾。"
  step-4: "每一步都換一個上下文是空的新 worker。主 agent 只記著計劃、清單和匯報。"
  step-5: "所有步驟做完後，reviewer 檢查整體結果。"
  caption: "一個管理者加多個 worker：主 agent 管計劃和清單，每一步交給一個拿著書面說明的新 worker。"
