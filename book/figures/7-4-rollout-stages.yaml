en:
  h-stage: "stage"
  h-gate: "enter it when"
  s1: "1  One team, core only"
  e1: "a team asks, owns its code"
  s2: "2  Add the team layer"
  e2: "core owned; logs readable"
  s3: "3  Open to the next team"
  e3: "rules get a 2nd reviewer"
  s4: "4  Everyone"
  e4: "logs show the rules hold"
  caption: "A rollout in stages. Each stage has a condition to enter it, and the condition is something you can look at. A proposal, not a record."
zh-Hant:
  h-stage: "階段"
  h-gate: "什麼時候進入"
  s1: "1  一個團隊，只有核心"
  e1: "有團隊想要，且自己管程式碼"
  s2: "2  加上團隊層"
  e2: "核心有擁有者，紀錄看得懂"
  s3: "3  開放給下一個團隊"
  e3: "規則修改有第二位審查者"
  s4: "4  所有人"
  e4: "紀錄顯示規則站得住"
  caption: "分階段上線。每個階段都有進入的條件，而且是看得到的東西。這是提議，不是紀錄。"
