en:
  setup-a: "setup A"
  setup-b: "setup B"
  low: "worse"
  high: "better"
  axis: "score of one run (schematic, not data)"
  one-a: "one run"
  one-b: "one run"
  overlap: "overlap"
  step-1: "One run of each. B scored higher. It looks like B is better."
  step-2: "Run each several times. A single setup now gives a spread of scores, not one score."
  step-3: "The ranges overlap. The one run that made B look better could have come from either setup. Report the spread."
  caption: "A schematic of why one run proves little: runs of the same setup differ, and when the ranges overlap, one run cannot tell two setups apart."
zh-Hant:
  setup-a: "設定 A"
  setup-b: "設定 B"
  low: "較差"
  high: "較好"
  axis: "單次運行的分數（示意，不是資料）"
  one-a: "一次運行"
  one-b: "一次運行"
  overlap: "重疊"
  step-1: "各跑一次。B 的分數比較高，看起來 B 比較好。"
  step-2: "各跑幾次。同一個設定現在給出的是一段分數的分佈，不是一個分數。"
  step-3: "兩段範圍重疊。讓 B 看起來比較好的那一次，可能來自任何一個設定。要報告分佈。"
  caption: "示意圖：為什麼單次運行證明不了什麼。同一個設定每次都不同，範圍重疊時，一次運行分不出兩個設定。"
