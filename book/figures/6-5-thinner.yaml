en:
  old: "FOR THE OLD MODEL"
  new: "AFTER THE EVALS SAY SO"
  b1: "written steps"
  b2: "extra checks"
  b3: "reminders, fixes"
  b4: "prompt wording"
  floor: "hard limits (stay)"
  rerun: "rerun the evals"
  rerun2: "new model, same tasks"
  step-1: "Over time I added steps, checks, reminders and wording, each to cover something the old model got wrong."
  step-2: "The model is upgraded. Run the same fixed tasks again, with and without each piece."
  step-3: "Pieces the evals show are no longer needed can go (dashed). Pieces that still help stay. Hard limits do not depend on the model's skill, so they stay."
  caption: "After a model upgrade, the scaffolding gets thinner where the evals say it can. The limits that guard against damage stay."
zh-Hant:
  old: "為舊模型搭的"
  new: "eval 說可以之後"
  b1: "寫出來的步驟"
  b2: "額外的檢查"
  b3: "提醒和變通辦法"
  b4: "提示的措辭"
  floor: "硬性限制（留著）"
  rerun: "重跑 eval"
  rerun2: "新模型，同一組任務"
  step-1: "隨著時間，我加了步驟、檢查、提醒和措辭，每一項都是為了補舊模型會犯的錯。"
  step-2: "模型升級了。把同一組固定任務再跑一次，每一項有它和沒有它各跑。"
  step-3: "eval 顯示已經不需要的可以拿掉（虛線）。還有幫助的留下。硬性限制不靠模型的本事，所以留著。"
  caption: "模型升級之後，eval 說可以的地方，腳手架就變薄。防止出事的限制留著。"
zh-Hans:
  old: "为旧模型搭的"
  new: "评测说可以之后"
  b1: "写明的步骤"
  b2: "额外的检查"
  b3: "提醒和变通办法"
  b4: "提示的措辞"
  floor: "硬性限制（留着）"
  rerun: "重跑评测"
  rerun2: "新模型，同一组任务"
  step-1: "随着时间，我加了步骤、检查、提醒和措辞，每一项都是为了补旧模型会犯的错。"
  step-2: "模型升级了。把同一组固定任务再跑一遍，每一项有它和没有它各跑一次。"
  step-3: "评测显示已经不需要的可以拿掉（虚线）。还有帮助的留下。硬性限制不靠模型的本事，所以留着。"
  caption: "模型升级之后，评测说可以的地方，脚手架就变薄。防止出事的限制留着。"
