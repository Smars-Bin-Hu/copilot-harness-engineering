en:
  col-level: "level"
  col-what: "what is in the window"
  col-when: "when"
  l1: "1. Menu"
  l1-what: "name + one description"
  l1-when: "always, every skill"
  l2: "2. Manual"
  l2-what: "the whole SKILL.md"
  l2-when: "when the request fits"
  l3: "3. Extras"
  l3-what: "scripts, notes, templates"
  l3-when: "if the manual says"
  step-1: "Level 1: every skill shows only a name and a description, all the time. This is cheap, and it is all the agent has when it chooses."
  step-2: "Level 2: when a request fits a description, the whole manual is read into the window."
  step-3: "Level 3: files next to the manual are read only if the manual points at them and the step needs them."
  caption: "A skill costs a line until it is used, a page when it is used, and more only if the job needs it. The description decides whether level 2 ever happens."
zh-Hant:
  col-level: "層"
  col-what: "視窗裡有什麼"
  col-when: "什麼時候"
  l1: "1. 目錄"
  l1-what: "名字 + 一句描述"
  l1-when: "每個 skill 都一直在"
  l2: "2. 說明書"
  l2-what: "整份 SKILL.md"
  l2-when: "需求對得上時"
  l3: "3. 附帶檔案"
  l3-what: "腳本、長筆記、範本"
  l3-when: "說明書叫它讀才讀"
  step-1: "第 1 層：每個 skill 一直只露出名字和描述。成本很低，agent 挑選時手上也只有這個。"
  step-2: "第 2 層：需求對上某個描述時，整份說明書才讀進視窗。"
  step-3: "第 3 層：說明書旁邊的檔案，只有說明書指到、而且這一步用得到時才讀。"
  caption: "一個 skill 沒用到時只佔一行，用到時佔一頁，工作需要時才再多一點。描述決定第 2 層會不會發生。"
