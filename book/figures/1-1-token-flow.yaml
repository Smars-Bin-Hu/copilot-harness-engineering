en:
  base: "rules + request"
  r1: "result 1"
  r2: "result 2"
  write: "writes a little"
  t1: "turn 1"
  t2: "turn 2"
  t3: "turn 3"
  cache: "The repeated part is cheaper, from the prompt cache"
  step-1: "Turn 1: the model reads the rules and your request, and writes a short tool call."
  step-2: "Turn 2: it reads all of that again, plus the result of the first call, and writes a little more."
  step-3: "Turn 3: it reads everything again, plus the second result. What it reads grows each turn; what it writes stays small."
  step-4: "The prompt cache charges less for the part that repeats exactly. This is why cache hits change the cost of a long task."
  caption: "In a loop, every turn re-reads the whole context. Reading, not writing, is what a long task mostly consists of."
zh-Hant:
  base: "規則 + 需求"
  r1: "結果 1"
  r2: "結果 2"
  write: "只寫一點點"
  t1: "第 1 輪"
  t2: "第 2 輪"
  t3: "第 3 輪"
  cache: "重複的部分可以走 prompt cache，價錢較低"
  step-1: "第 1 輪：模型讀規則和你的需求，寫出一個很短的工具呼叫。"
  step-2: "第 2 輪：它把這些再讀一遍，加上第一次呼叫的結果，再寫一點點。"
  step-3: "第 3 輪：全部再讀一遍，加上第二個結果。讀的越來越多，寫的一直很少。"
  step-4: "prompt cache 對完全重複的部分收費較低。所以快取命中會改變長任務的成本。"
  caption: "在迴圈裡，每一輪都把整個上下文重讀一遍。長任務主要是在讀，不是在寫。"
