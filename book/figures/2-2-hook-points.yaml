en:
  prompt: "prompt"
  model: "the model"
  tool: "tool call"
  end: "the agent stops"
  h-prompt: "prompt sent"
  h-pre: "before the call"
  h-pre-note: "the only place that can refuse"
  h-post: "after it"
  h-stop: "about to stop"
  note: "The platform runs your code at each of these points, every time."
  step-1: "When you send a prompt, a hook can add words the model will read, such as the rules."
  step-2: "Before a tool runs, a hook sees the tool name and its arguments. It can let the call through, refuse it, or refuse it with a reason."
  step-3: "After the tool ran, a hook can write a record or add a note for the model. It cannot undo what happened."
  step-4: "When the agent is about to stop, a hook can say: not yet. This is how you keep an agent going."
  caption: "Hooks sit at fixed points of the loop. The platform calls them every time, so the model cannot skip them."
zh-Hant:
  prompt: "prompt"
  model: "模型"
  tool: "工具呼叫"
  end: "agent 要停了"
  h-prompt: "送出 prompt"
  h-pre: "呼叫之前"
  h-pre-note: "唯一能拒絕的地方"
  h-post: "呼叫之後"
  h-stop: "快要停下"
  note: "平台在這幾個點，每一次都會執行你的程式。"
  step-1: "你送出 prompt 時，hook 可以加幾句話給模型讀，例如規則。"
  step-2: "工具執行之前，hook 看得到工具名稱和參數。它可以放行、拒絕，或附上理由拒絕。"
  step-3: "工具執行之後，hook 可以寫一筆紀錄，或給模型加一句話。已經發生的事它改不了。"
  step-4: "agent 快要停下時，hook 可以說：還不行。想讓 agent 繼續做，就靠這一點。"
  caption: "hook 站在循環裡固定的幾個點上。平台每次都會呼叫它，模型跳不過去。"
zh-Hans:
  prompt: "prompt"
  model: "模型"
  tool: "工具调用"
  end: "agent 要停了"
  h-prompt: "发出 prompt"
  h-pre: "调用之前"
  h-pre-note: "唯一能拒绝的地方"
  h-post: "调用之后"
  h-stop: "即将停止"
  note: "平台在这几个点，每一次都会运行你的代码。"
  step-1: "你发出 prompt 时，hook 可以加几句话给模型读，例如规则。"
  step-2: "工具运行之前，hook 看得到工具名和参数。它可以放行、拒绝，或者附上原因拒绝。"
  step-3: "工具运行之后，hook 可以写一条记录，或者给模型加一句话。已经发生的事它改不了。"
  step-4: "agent 即将停止时，hook 可以说：还没完。想让 agent 接着干，就靠这一点。"
  caption: "hook 站在循环里固定的几个点上。平台每次都会调用它，模型跳不过去。"
