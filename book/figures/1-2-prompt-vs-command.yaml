en:
  left-title: "In the prompt"
  l1: "1. check folder is clean"
  l2: "2. copy the files"
  l3: "3. write the record"
  left-note: "May skip or reorder steps"
  right-title: "In a command"
  r1: "agent runs one command"
  r2: "checks preconditions"
  r3: "copies the files"
  r4: "writes the record"
  right-note: "Same steps every time"
  right-note2: "A short result comes back"
  caption: "The same job, two ways. Asking the model to follow steps is a request; a command that does them is code."
zh-Hant:
  left-title: "寫在提示裡"
  l1: "1. 確認資料夾是乾淨的"
  l2: "2. 複製檔案"
  l3: "3. 寫下紀錄"
  left-note: "agent 可能跳步或換順序"
  right-title: "寫成命令"
  r1: "agent 跑一條命令"
  r2: "檢查前置條件"
  r3: "複製檔案"
  r4: "寫下紀錄"
  right-note: "每次步驟都一樣"
  right-note2: "回來一個很短的結果"
  caption: "同一件事的兩種做法。叫模型照步驟做是請求；由命令來做是程式碼。"
