en:
  platform: "platform"
  adapter: "adapter"
  adapter-note: "the only part that knows the platform"
  m1: "tasks"
  m2: "gate"
  m3: "records"
  mod-note: "each module gives its view; none calls another"
  core: "core"
  core-rule: "deny > ask > allow"
  back: "one answer, platform format"
  step-1: "The platform sends an event in its own format. The adapter, the one entry point, turns it into one common event."
  step-2: "The modules that listen to this event each look at it. One checks paths and commands, one keeps records, one handles the task. They do not talk to each other."
  step-3: "The core merges the views. If any module says deny, the answer is deny; then ask; then allow."
  step-4: "The adapter turns the answer back into what the platform expects. If anything above throws an error, the error goes to a log and the call is let through."
  caption: "One call through the enforcement layer. Only the adapter knows the platform, so only the adapter changes when the platform does."
zh-Hant:
  platform: "平台"
  adapter: "轉接層"
  adapter-note: "唯一認得平台的部分"
  m1: "任務"
  m2: "關卡"
  m3: "紀錄"
  mod-note: "各模組給各自的意見，彼此不呼叫"
  core: "核心"
  core-rule: "拒絕 > 詢問 > 放行"
  back: "一個答案，用平台要的格式"
  step-1: "平台用自己的格式送來一個事件。轉接層是唯一的入口，把它變成一個共通的事件。"
  step-2: "聽這個事件的模組各自看一眼。一個查路徑和指令，一個做紀錄，一個管任務。它們彼此不說話。"
  step-3: "核心合併各家意見。只要有一個模組說拒絕，答案就是拒絕；其次是詢問；最後才是放行。"
  step-4: "轉接層把答案轉回平台要的格式。上面任何一步出錯，錯誤會寫進紀錄，這次呼叫放行。"
  caption: "一次呼叫穿過執行層。只有轉接層認得平台，所以平台改了，只改轉接層。"
zh-Hans:
  platform: "平台"
  adapter: "适配器"
  adapter-note: "唯一认得平台的部分"
  m1: "任务"
  m2: "关卡"
  m3: "记录"
  mod-note: "各模块给各自的意见，彼此不调用"
  core: "核心"
  core-rule: "拒绝 > 询问 > 放行"
  back: "一个答案，用平台要的格式"
  step-1: "平台用自己的格式送来一个事件。适配器是唯一的入口，把它变成一个通用事件。"
  step-2: "关心这个事件的模块各自看一眼。一个查路径和命令，一个做记录，一个管任务。它们彼此不说话。"
  step-3: "核心合并各家意见。只要有一个模块说拒绝，答案就是拒绝；其次是询问；最后才是放行。"
  step-4: "适配器把答案转回平台要的格式。上面任何一步出错，错误会写进日志，这次调用放行。"
  caption: "一次调用穿过执行层。只有适配器认得平台，所以平台改了，只改适配器。"
