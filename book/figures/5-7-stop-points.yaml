en:
  start: "start"
  done: "done"
  budget: "budget spent"
  refuse: "refused often"
  stall: "no progress"
  choice: "needs a person"
  hand: "At every stop the run hands back:"
  hand2: "why it stopped, where it is, what a person must decide"
  step-1: "An unattended run goes along a road from the start to done, with nobody watching."
  step-2: "Stop 1: the total budget (usage and time, main agent and helpers together) is spent."
  step-3: "Stop 2: the agent keeps trying things it is not allowed to do."
  step-4: "Stop 3: it pushes on but no step gets done."
  step-5: "Stop 4: it reaches a choice that only a person can make."
  step-6: "Whichever stop it hits, it hands back the reason, the place it reached and the open question."
  caption: "The run goes only as far as its stop rules reach. Each stop hands the work back with a reason."
zh-Hant:
  start: "開始"
  done: "完成"
  budget: "預算用完"
  refuse: "常被拒絕"
  stall: "沒有進展"
  choice: "需要人決定"
  hand: "每次停下，都要交回："
  hand2: "為什麼停、走到哪、人要決定什麼"
  step-1: "無人值守的運行沿著一條路從開始走到完成，沒有人看著。"
  step-2: "停點 1：總預算（用量和時間，主 agent 和幫手合計）用完了。"
  step-3: "停點 2：agent 一再嘗試不被允許的事。"
  step-4: "停點 3：一直往前推，卻沒有完成任何一步。"
  step-5: "停點 4：遇到只有人才能做的選擇。"
  step-6: "不管在哪個停點停下，都交回原因、走到的位置和還沒決定的問題。"
  caption: "運行只能走到停止規則管得到的地方。每個停點都帶著理由把工作交回來。"
