<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <rect class="box" x="10" y="120" width="112" height="64" rx="8"/>
  <text class="label" x="66" y="148" text-anchor="middle" data-t="tasks">x</text>
  <text class="label-muted" x="66" y="167" text-anchor="middle" data-t="tasks-note">x</text>

  <g data-step="2">
    <path class="line" d="M122 140 H128 V70 H134 M122 164 H128 V230 H134"/>
    <path class="line" d="M248 70 H260 M248 230 H260"/>
    <path class="head" d="M134 64 L144 70 L134 76 Z M134 224 L144 230 L134 236 Z M260 64 L270 70 L260 76 Z M260 224 L270 230 L260 236 Z"/>
    <rect class="box" x="144" y="42" width="104" height="56" rx="8"/>
    <text class="label" x="196" y="66" text-anchor="middle" data-t="run-before">x</text>
    <text class="label-muted" x="196" y="85" text-anchor="middle" data-t="run-note">x</text>
    <rect class="box" x="144" y="202" width="104" height="56" rx="8"/>
    <text class="label" x="196" y="226" text-anchor="middle" data-t="run-after">x</text>
    <text class="label-muted" x="196" y="245" text-anchor="middle" data-t="run-note">x</text>
  </g>

  <g data-step="3">
    <rect class="box-lit" x="270" y="42" width="130" height="56" rx="8"/>
    <text class="label-lit" x="335" y="66" text-anchor="middle" data-t="score">x</text>
    <text class="label-muted" x="335" y="85" text-anchor="middle" data-t="score-note">x</text>
    <rect class="box-lit" x="270" y="202" width="130" height="56" rx="8"/>
    <text class="label-lit" x="335" y="226" text-anchor="middle" data-t="score">x</text>
    <text class="label-muted" x="335" y="245" text-anchor="middle" data-t="score-note">x</text>
  </g>

  <g data-step="4">
    <path class="line" d="M400 70 H420 V140 H430 M400 230 H420 V164 H430"/>
    <path class="head" d="M430 134 L440 140 L430 146 Z"/>
    <rect class="box" x="440" y="116" width="150" height="72" rx="8"/>
    <text class="label" x="515" y="146" text-anchor="middle" data-t="compare">x</text>
    <text class="label-muted" x="515" y="166" text-anchor="middle" data-t="compare-note">x</text>
  </g>

  <g data-step="5">
    <path class="line-lit" d="M515 188 V220"/>
    <path class="head-lit" d="M509 220 L515 230 L521 220 Z"/>
    <rect class="box-lit" x="440" y="230" width="150" height="58" rx="8"/>
    <text class="label-lit" x="515" y="255" text-anchor="middle" data-t="read">x</text>
    <text class="label-muted" x="515" y="274" text-anchor="middle" data-t="read-note">x</text>
  </g>
</svg>
