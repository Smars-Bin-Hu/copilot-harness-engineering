en:
  call: "a command"
  hook: "hook"
  sees: "sees the text of the call"
  runs: "the command runs"
  unseen: "its effect is not seen"
  unseen2: "variable paths, scripts: unseen"
  step-1: "A hook sees the call: the tool name and the text of the command. It decides before anything runs."
  step-2: "Once a command is let through, the hook is out of the picture. A script it starts can do things the command line never showed."
  step-3: "The text itself can hide the effect: a path built from variables, or a script written first and run afterwards."
  caption: "A hook sees calls, not effects. Where the effect matters, limit what the agent can reach."
zh-Hant:
  call: "一條終端機指令"
  hook: "hook"
  sees: "看得到呼叫的文字"
  runs: "指令開始執行"
  unseen: "它做了什麼，看不到"
  unseen2: "變數拼的路徑、先寫好的腳本：看不到"
  step-1: "hook 看到的是呼叫：工具名稱和指令的文字。它在任何東西執行之前就決定。"
  step-2: "指令一旦放行，hook 就退出畫面了。它啟動的腳本做什麼，指令列上看不出來。"
  step-3: "文字本身可能藏住後果：用變數拼出來的路徑，或先寫好、之後才執行的腳本。"
  caption: "hook 看得到呼叫，看不到後果。後果要緊的地方，就限制 agent 碰得到什麼。"
