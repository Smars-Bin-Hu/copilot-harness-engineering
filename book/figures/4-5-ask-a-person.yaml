en:
  agent: "the agent"
  person: "a person"
  env: "environment"
  q: "question +"
  q2: "read-only query"
  run: "the person reads it,"
  run2: "then runs it"
  a: "answer,"
  a2: "pasted back"
  note: "No line from the agent to the environment."
  step-1: "The agent writes down what it needs to know, with a query that only reads."
  step-2: "A person reads the query and runs it against the environment."
  step-3: "The person pastes the answer back. The agent goes on, and the answer is on record."
  caption: "A person stands between the agent and the environment. The agent has no connection to misuse."
zh-Hant:
  agent: "agent"
  person: "人"
  env: "環境"
  q: "問題＋"
  q2: "唯讀查詢"
  run: "人先看過，"
  run2: "再去跑"
  a: "答案，"
  a2: "貼回來"
  note: "agent 和環境之間沒有連線。"
  step-1: "agent 寫下它想知道的事，附上一個只讀的查詢。"
  step-2: "人看過查詢，再對環境執行。"
  step-3: "人把答案貼回來。agent 繼續做，答案也留下了紀錄。"
  caption: "人站在 agent 和環境之間。agent 沒有可被濫用的連線。"
