en:
  board-title: "MANY TASKS: THE BOARD"
  t1: "A: to approve"
  t2: "B: running"
  t3: "C: finished"
  t4: "D: needs you"
  board-note: "The board points;"
  board-note2: "the report explains."
  page-title: "ONE TASK: ONE PAGE"
  s1: "1. What was asked, what was done"
  s2: "2. Who approved, and when"
  s3: "3. What changed (files, lines)"
  s4: "4. Checks: how many, result"
  s5: "5. What was refused, and why"
  s6: "6. Time and usage, by stage"
  foot: "Every line comes from a record,"
  foot2: "not from the agent."
  caption: "The board shows many tasks at a glance. When one task finishes, it gets one page a person can read in five minutes."
zh-Hant:
  board-title: "很多任務：看板"
  t1: "A：等批准"
  t2: "B：agent 在做"
  t3: "C：做完了"
  t4: "D：等你"
  board-note: "看板指路，"
  board-note2: "報告解釋。"
  page-title: "一個任務：一頁"
  s1: "1. 要求什麼、做了什麼"
  s2: "2. 誰批准、什麼時候"
  s3: "3. 改了什麼（檔案、行數）"
  s4: "4. 檢查：幾次、結果如何"
  s5: "5. 什麼被拒絕、為什麼"
  s6: "6. 各階段的時間和用量"
  foot: "每一行都來自紀錄，"
  foot2: "不是 agent 說的。"
  caption: "看板讓你一眼看完很多任務。一個任務做完，就有一頁五分鐘讀得完的報告。"
zh-Hans:
  board-title: "很多任务：看板"
  t1: "A：等审批"
  t2: "B：agent 在做"
  t3: "C：做完了"
  t4: "D：等你"
  board-note: "看板指路，"
  board-note2: "报告解释。"
  page-title: "一个任务：一页"
  s1: "1. 要求什么、做了什么"
  s2: "2. 谁审批、什么时候"
  s3: "3. 改了什么（文件、行数）"
  s4: "4. 检查：几次、结果如何"
  s5: "5. 什么被拒绝、为什么"
  s6: "6. 各阶段的时间和用量"
  foot: "每一行都来自记录，"
  foot2: "不是 agent 说的。"
  caption: "看板让你一眼看完很多任务。一个任务做完，就有一页五分钟读得完的报告。"
