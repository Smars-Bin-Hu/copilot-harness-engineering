en:
  c1: "check 1"
  c1v: "PASS"
  c2: "check 2"
  c2v: "FAIL"
  c3: "check 3"
  c3v: "PASS"
  c4: "check 4"
  c4v: "PASS"
  edit: "work edited"
  edit2: "after the pass"
  n1: "count 1"
  n2: "count 0"
  n3: "count 1"
  n4: "count 2"
  n5: "count 0"
  axis: "n = 2 passes in a row, on the work as it is now"
  step-1: "The first check passes. The count is 1."
  step-2: "The second check fails. A fail resets the count to 0."
  step-3: "The third check passes. The count is 1 again."
  step-4: "The fourth passes too. Two in a row: the count reaches n = 2, so the work may go on."
  step-5: "If the work is edited after that, the earlier passes belong to an older version and no longer count. The count is 0."
  caption: "Code counts the passes in a row. A fail or an edit sends the count back to zero."
zh-Hant:
  c1: "第 1 次檢查"
  c1v: "通過"
  c2: "第 2 次檢查"
  c2v: "不通過"
  c3: "第 3 次檢查"
  c3v: "通過"
  c4: "第 4 次檢查"
  c4v: "通過"
  edit: "成果被改動"
  edit2: "在通過之後"
  n1: "計數 1"
  n2: "計數 0"
  n3: "計數 1"
  n4: "計數 2"
  n5: "計數 0"
  axis: "n = 2：對現在這版成果連續通過 2 次"
  step-1: "第一次檢查通過，計數是 1。"
  step-2: "第二次不通過，計數歸零。"
  step-3: "第三次通過，計數又是 1。"
  step-4: "第四次也通過。連續兩次，計數達到 n = 2，成果可以往下走。"
  step-5: "之後如果成果又被改動，先前的通過屬於舊版本，不再算數，計數歸零。"
  caption: "由程式數連續通過的次數。不通過或成果被改動，計數就歸零。"
