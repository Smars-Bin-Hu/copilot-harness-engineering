en:
  a: "reads private data"
  a-note: "files, keys, chats"
  b: "reads untrusted text"
  b-note: "issues, web, tool output"
  c: "can send data out"
  c-note: "web, email, a push"
  danger: "danger"
  rule: "Take away any one circle and the middle disappears."
  caption: "The three things that together make an injected order dangerous. The middle is where a stranger's text can make the agent leak your data."
zh-Hant:
  a: "讀得到私密資料"
  a-note: "檔案、金鑰、對話"
  b: "會讀不可信的文字"
  b-note: "issue、網頁、工具回傳"
  c: "能把資料送出去"
  c-note: "網路、郵件、push"
  danger: "危險"
  rule: "拿掉任何一個圈，中間就不見了。"
  caption: "三樣湊在一起，被植入的指令才會危險。中間這塊，就是陌生人的文字能讓 agent 洩漏你的資料的地方。"
