en:
  change: "change code"
  change-n: "the agent edits"
  run: "run the check"
  run-n: "test, linter, program"
  read: "read result"
  read-n: "short and clear"
  fix-n: "fails: fix and run it again; passes: go on"
  rev: "a reviewer finds problems afterwards"
  step-1: "The agent changes the code."
  step-2: "It runs a check it can start itself: the tests, the linter, the program."
  step-3: "It reads the result. The result must be short enough, and clear enough, to act on."
  step-4: "If the check fails, it fixes the problem and runs the check again, inside the same loop. No person is needed."
  step-5: "A reviewer works after the loop. It can point out problems, but the agent has already moved on."
  caption: "A check the agent can run and read puts feedback inside the loop."
zh-Hant:
  change: "改程式碼"
  change-n: "agent 動手改"
  run: "跑檢查"
  run-n: "測試、linter、程式"
  read: "讀結果"
  read-n: "短而清楚"
  fix-n: "沒過：修了再跑；過了：往下走"
  rev: "檢查者事後才找問題"
  step-1: "agent 改程式碼。"
  step-2: "它跑一個自己能啟動的檢查：測試、linter、程式本身。"
  step-3: "它讀結果。結果要夠短、夠清楚，才讀得懂、改得動。"
  step-4: "檢查沒過，它就修，再跑一次，全在同一個循環裡，不需要人。"
  step-5: "檢查者在循環之後才工作。它能指出問題，但 agent 已經往下走了。"
  caption: "agent 自己能跑、能讀的檢查，把回饋放進循環裡。"
